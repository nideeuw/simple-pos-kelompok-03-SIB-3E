openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
  description: Dokumentasi API untuk aplikasi Simple POS.

servers:
  - url: http://127.0.0.1:8000
    description: Local development server

paths:
  /api/login:
    post:
      summary: Login pengguna
      description: Login untuk mendapatkan token autentikasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: kasir@pos.test
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 1|your-access-token
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid credentials

  /api/products:
    get:
      summary: Mendapatkan daftar produk
      description: Mengambil daftar produk yang tersedia dengan dukungan paginasi, filter, dan pencarian.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman untuk paginasi data
          required: false
          schema:
            type: integer
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Jumlah item per halaman (minimal 1, maksimal 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
            example: 15
        - name: q
          in: query
          description: Kata kunci pencarian berdasarkan nama produk
          required: false
          schema:
            type: string
            minLength: 2
            example: Kopi
        - name: category_id
          in: query
          description: Filter produk berdasarkan ID kategori
          required: false
          schema:
            type: integer
            example: 1
        - name: sort
          in: query
          description: Pengurutan data (contoh name, -name, price, -price)
          required: false
          schema:
            type: string
            enum:
              - name
              - -name
              - price
              - -price
            default: name
            example: name
      responses:
        '200':
          description: Berhasil mengambil daftar produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Flat Monitor
                        price:
                          type: integer
                          example: 500000
                        category:
                          type: string
                          example: Electronics
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: http://127.0.0.1:8000/api/products?page=1
                      last:
                        type: string
                        example: http://127.0.0.1:8000/api/products?page=10
                      prev:
                        type: string
                        nullable: true
                        example: null
                      next:
                        type: string
                        nullable: true
                        example: http://127.0.0.1:8000/api/products?page=2
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 10
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 150
        '401':
          description: Token tidak tersedia atau tidak valid
        '422':
          description: Validasi parameter query gagal (misal per_page melebihi batas atau sort tidak valid)

  /api/transactions:
    post:
      summary: Membuat transaksi
      description: Menyimpan transaksi baru berdasarkan produk yang dipilih.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - qty
                    properties:
                      product_id:
                        type: integer
                        example: 1
                      qty:
                        type: integer
                        example: 2
      responses:
        '201':
          description: Transaksi berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2501
                      total:
                        type: integer
                        example: 1000000
        '401':
          description: Token tidak tersedia atau tidak valid
        '422':
          description: Data transaksi tidak valid

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token